name: Supervised Baseline Tests

on:
  pull_request:
    paths:
      - "apps/forex-scanner/app/ml/**"
      - "apps/forex-scanner/scripts/train_supervised_baseline.py"
      - "apps/forex-scanner/tests/test_supervised_baseline.py"
      - "apps/forex-scanner/docs/supervised_baseline.md"
      - "apps/forex-scanner/pyproject.toml"
      - ".github/workflows/supervised-baseline-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forex-scanner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/forex-scanner/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,ml]'

      - name: Run supervised baseline tests
        run: |
          python -m pytest -q tests/test_supervised_baseline.py --maxfail=1
          python -m pytest -q tests/test_decision_dataset.py --maxfail=1
          python -m py_compile \
            app/ml/temporal.py \
            app/ml/baseline.py \
            scripts/train_supervised_baseline.py
