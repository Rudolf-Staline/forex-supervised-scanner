name: Portfolio Backtester Tests

on:
  push:
    paths:
      - 'apps/forex-scanner/app/backtest/portfolio.py'
      - 'apps/forex-scanner/scripts/portfolio_backtest_report.py'
      - 'apps/forex-scanner/tests/test_portfolio_backtester.py'
      - '.github/workflows/portfolio-backtester-tests.yml'
  pull_request:
    paths:
      - 'apps/forex-scanner/app/backtest/portfolio.py'
      - 'apps/forex-scanner/scripts/portfolio_backtest_report.py'
      - 'apps/forex-scanner/tests/test_portfolio_backtester.py'
      - '.github/workflows/portfolio-backtester-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: apps/forex-scanner
    env:
      EXECUTION_MODE: paper
      BROKER_MODE: paper
      ALLOW_LIVE_TRADING: 'false'
      AUTO_BOT_ENABLED: 'false'
      MT5_DEMO_ONLY: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/forex-scanner/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run portfolio tests
        run: |
          python -m pytest -q tests/test_portfolio_backtester.py --maxfail=1
          python -m py_compile app/backtest/portfolio.py scripts/portfolio_backtest_report.py
