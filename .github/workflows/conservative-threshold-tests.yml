name: Conservative Threshold Tests

on:
  push:
    paths:
      - 'apps/forex-scanner/app/backtest/threshold_selection.py'
      - 'apps/forex-scanner/app/backtest/conservative_walk_forward.py'
      - 'apps/forex-scanner/scripts/walk_forward_report.py'
      - 'apps/forex-scanner/tests/test_threshold_selection.py'
      - 'apps/forex-scanner/tests/test_conservative_walk_forward.py'
      - '.github/workflows/conservative-threshold-tests.yml'
  pull_request:
    paths:
      - 'apps/forex-scanner/app/backtest/threshold_selection.py'
      - 'apps/forex-scanner/app/backtest/conservative_walk_forward.py'
      - 'apps/forex-scanner/scripts/walk_forward_report.py'
      - 'apps/forex-scanner/tests/test_threshold_selection.py'
      - 'apps/forex-scanner/tests/test_conservative_walk_forward.py'
      - '.github/workflows/conservative-threshold-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: apps/forex-scanner
    env:
      EXECUTION_MODE: paper
      BROKER_MODE: paper
      ALLOW_LIVE_TRADING: 'false'
      MT5_DEMO_ONLY: 'true'
      AUTO_BOT_ENABLED: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/forex-scanner/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run threshold tests
        run: |
          python -m pytest -q tests/test_threshold_selection.py --maxfail=1
          python -m pytest -q tests/test_conservative_walk_forward.py --maxfail=1
          python -m pytest -q tests/test_walk_forward.py --maxfail=1
          python -m pytest -q tests/test_walk_forward_parallel.py --maxfail=1
          python -m py_compile \
            app/backtest/threshold_selection.py \
            app/backtest/conservative_walk_forward.py \
            scripts/walk_forward_report.py
