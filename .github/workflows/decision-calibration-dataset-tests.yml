name: Decision Calibration Dataset Tests

on:
  pull_request:
    paths:
      - "apps/forex-scanner/app/reporting/decision_dataset.py"
      - "apps/forex-scanner/scripts/build_decision_calibration_dataset.py"
      - "apps/forex-scanner/tests/test_decision_dataset.py"
      - "apps/forex-scanner/docs/decision_calibration_dataset.md"
      - ".github/workflows/decision-calibration-dataset-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forex-scanner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/forex-scanner/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run dataset tests
        run: |
          python -m pytest -q tests/test_decision_dataset.py --maxfail=1
          python -m py_compile \
            app/reporting/decision_dataset.py \
            scripts/build_decision_calibration_dataset.py
