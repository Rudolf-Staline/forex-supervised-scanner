name: Source-Aware Supervised Tests

on:
  pull_request:
    paths:
      - "apps/forex-scanner/app/ml/source_aware.py"
      - "apps/forex-scanner/scripts/train_source_aware_baseline.py"
      - "apps/forex-scanner/tests/test_source_aware_supervised.py"
      - "apps/forex-scanner/docs/source_aware_supervised.md"
      - ".github/workflows/source-aware-supervised-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forex-scanner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/forex-scanner/pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,ml]"

      - name: Run source-aware tests
        run: |
          python -m pytest -q tests/test_source_aware_supervised.py --maxfail=1
          python -m pytest -q tests/test_supervised_baseline.py --maxfail=1
          python -m pytest -q tests/test_shadow_labeling.py --maxfail=1
          python -m py_compile \
            app/ml/source_aware.py \
            scripts/train_source_aware_baseline.py
