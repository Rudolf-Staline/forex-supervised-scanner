name: Pattern ML Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/forex-scanner/app/pattern_ml/**"
      - "apps/forex-scanner/scripts/train_pattern_model.py"
      - "apps/forex-scanner/tests/test_pattern_ml*.py"
      - "apps/forex-scanner/pyproject.toml"
      - ".github/workflows/pattern-ml-tests.yml"

permissions:
  contents: read

jobs:
  pattern-ml:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/forex-scanner/pyproject.toml

      - name: Install scanner with ML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "apps/forex-scanner[dev,ml]"

      - name: Run pattern ML tests
        working-directory: apps/forex-scanner
        run: |
          python -m pytest tests/test_pattern_ml.py tests/test_pattern_ml_integration.py tests/test_pattern_ml_training_optional.py
